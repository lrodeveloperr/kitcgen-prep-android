name: Build Kitchen Prep Android Review APK

on:
  push:
    branches: [timeline-pulse-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-prep-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-review-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Reconstruct verified source package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* | base64 --decode > "$RUNNER_TEMP/kitchen-prep-source.tar.gz"
          printf '%s  %s\n' '779fec4dc2bea36c09a27266e33030f35d61f49e45a52c0881ecc848cb7081a2' "$RUNNER_TEMP/kitchen-prep-source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kitchen-prep-source.tar.gz" -C .
          if [ -d bootstrap/overrides ]; then
            cp -a bootstrap/overrides/. .
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build, unit test and lint QA variant
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testQaUnitTest :app:lintQa :app:assembleQa --stacktrace

      - name: Verify and package review APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/qa -type f -name '*.apk' | head -1)"
          test -n "$APK"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          cp "$APK" Kitchen-Prep-Board-Timeline-Pulse-Review.apk
          sha256sum Kitchen-Prep-Board-Timeline-Pulse-Review.apk > Kitchen-Prep-Board-Timeline-Pulse-Review.apk.sha256

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-prep-timeline-pulse-review-apk
          path: |
            Kitchen-Prep-Board-Timeline-Pulse-Review.apk
            Kitchen-Prep-Board-Timeline-Pulse-Review.apk.sha256
            badging.txt
            app/build/reports/lint-results-qa.html
          if-no-files-found: error
          retention-days: 14
