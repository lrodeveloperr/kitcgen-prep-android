name: Build Kitchen VGC Review APK

on:
  push:
    branches:
      - vgc-release-candidate
    paths:
      - .github/workflows/vgc-release-apk.yml
      - .source/**
      - flutter_app/android/**

permissions:
  contents: read

concurrency:
  group: kitchen-vgc-review-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Restore reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .source/integration.part00 .source/integration.part01 .source/integration.part02 .source/integration.part03 > "$RUNNER_TEMP/integration.b64"
          echo '18a85cefef0b769066b8c9d89a06e9015f0441a278b9af649db4c3106566ad52  '"$RUNNER_TEMP/integration.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/integration.b64" > "$RUNNER_TEMP/integration.tgz"
          rm -rf "$RUNNER_TEMP/reviewed"
          mkdir -p "$RUNNER_TEMP/reviewed"
          tar -xzf "$RUNNER_TEMP/integration.tgz" -C "$RUNNER_TEMP/reviewed"
          test -f "$RUNNER_TEMP/reviewed/integration/lib/main.dart"
          rm -rf flutter_app/lib flutter_app/test
          cp -a "$RUNNER_TEMP/reviewed/integration/lib" flutter_app/lib
          cp -a "$RUNNER_TEMP/reviewed/integration/test" flutter_app/test
          cp "$RUNNER_TEMP/reviewed/integration/pubspec.yaml" flutter_app/pubspec.yaml
          cp "$RUNNER_TEMP/reviewed/integration/analysis_options.yaml" flutter_app/analysis_options.yaml
          cp "$RUNNER_TEMP/reviewed/integration/very_good.yaml" flutter_app/very_good.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter_app/pubspec.yaml')
          s=p.read_text()
          if 'flutter:\n  generate: true\n' not in s:
              s=s.replace('flutter:\n  uses-material-design: true\n','flutter:\n  generate: true\n  uses-material-design: true\n')
          p.write_text(s)
          PY

      - name: Resolve packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze for blocking issues
        working-directory: flutter_app
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          analyze_rc=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^[[:space:]]*(error|warning) •' "$RUNNER_TEMP/flutter-analyze.log"; then
            echo 'Blocking analyzer error or warning found.' >&2
            exit "$analyze_rc"
          fi
          echo 'Analyzer contains info-level cleanup only; continuing review build.'

      - name: Unit and widget tests
        working-directory: flutter_app
        run: flutter test

      - name: Build production-identity review APK
        working-directory: flutter_app
        run: flutter build apk --debug --flavor production -t lib/main.dart --build-name 2.0.0 --build-number 200

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="flutter_app/build/app/outputs/flutter-apk/app-production-debug.apk"
          test -s "$apk"
          cp "$apk" Kitchen-Prep-Board-English-Review.apk
          sha256sum Kitchen-Prep-Board-English-Review.apk | tee Kitchen-Prep-Board-English-Review.apk.sha256

      - name: Upload review APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitchen-Prep-Board-English-Review
          path: |
            Kitchen-Prep-Board-English-Review.apk
            Kitchen-Prep-Board-English-Review.apk.sha256
          if-no-files-found: error
          retention-days: 14
