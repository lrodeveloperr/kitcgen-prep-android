name: Refresh Kitchen Ocean Pearl identity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Materialize canonical Ocean Pearl mark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('flutter_app')
          src = Image.open(root / 'kitchen_prep_mark.png').convert('RGB')
          assert src.size == (1024, 1024)

          ios = root / 'ios/Runner/Assets.xcassets/AppIcon.appiconset'
          ios_sizes = {
              'Icon-App-20x20@1x.png': 20, 'Icon-App-20x20@2x.png': 40,
              'Icon-App-20x20@3x.png': 60, 'Icon-App-29x29@1x.png': 29,
              'Icon-App-29x29@2x.png': 58, 'Icon-App-29x29@3x.png': 87,
              'Icon-App-40x40@1x.png': 40, 'Icon-App-40x40@2x.png': 80,
              'Icon-App-40x40@3x.png': 120, 'Icon-App-60x60@2x.png': 120,
              'Icon-App-60x60@3x.png': 180, 'Icon-App-76x76@1x.png': 76,
              'Icon-App-76x76@2x.png': 152, 'Icon-App-83.5x83.5@2x.png': 167,
              'Icon-App-1024x1024@1x.png': 1024,
          }
          for name, px in ios_sizes.items():
              src.resize((px, px), Image.Resampling.LANCZOS).save(
                  ios / name, optimize=True)

          android = root / 'android/app/src/main'
          src.resize((512, 512), Image.Resampling.LANCZOS).save(
              android / 'ic_launcher-playstore.png', optimize=True)
          for folder, px in {
              'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192,
          }.items():
              out = android / 'res' / folder
              icon = src.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(out / 'ic_launcher.png', optimize=True)
              icon.save(out / 'ic_launcher_round.png', optimize=True)

          adaptive = android / 'res/drawable-nodpi/command_rail_mark.png'
          adaptive.parent.mkdir(parents=True, exist_ok=True)
          src.save(adaptive, optimize=True)

          for bundle in ('AppIcon.icon', 'AppIcon-dev.icon', 'AppIcon-stg.icon'):
              src.save(
                  root / 'ios/Runner/AppIcons' / bundle / 'Assets/Logo.png',
                  optimize=True)
          PY
      - name: Commit only deterministic derivatives
        shell: bash
        run: |
          set -euo pipefail
          git add flutter_app/android/app/src/main \
                  flutter_app/ios/Runner/Assets.xcassets/AppIcon.appiconset \
                  flutter_app/ios/Runner/AppIcons/*/Assets/Logo.png
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh Ocean Pearl identity derivatives'
          git push origin HEAD:main
