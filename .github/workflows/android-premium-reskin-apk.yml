name: Android premium reskin and APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-premium-reskin-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply Android-only premium presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('flutter_app/lib/features/kitchen_shell.dart')
          text = p.read_text()

          anchor = "bool _usesCalmWorkbench(BuildContext context) =>\n    const bool.fromEnvironment('FORCE_IOS_SKIN') ||\n    Theme.of(context).platform == TargetPlatform.iOS ||\n    Theme.of(context).platform == TargetPlatform.macOS;"
          replacement = anchor + "\n\nbool _usesPremiumAndroid(BuildContext context) =>\n    Theme.of(context).platform == TargetPlatform.android;"
          if '_usesPremiumAndroid' not in text:
              if anchor not in text:
                  raise SystemExit('platform skin anchor missing')
              text = text.replace(anchor, replacement, 1)

          frame_start = text.index('class PageFrame extends StatelessWidget {')
          frame_end = text.index('\nclass HomePage extends StatelessWidget {', frame_start)
          old_frame = text[frame_start:frame_end]
          if 'SliverAppBar.large' not in old_frame and '_usesPremiumAndroid' not in old_frame:
              raise SystemExit('PageFrame no longer matches expected baseline')

          new_frame = r'''class PageFrame extends StatelessWidget {
  const PageFrame({required this.title, required this.child, this.action, super.key});
  final String title;
  final Widget child;
  final Widget? action;

  @override
  Widget build(BuildContext context) {
    if (!_usesPremiumAndroid(context)) {
      return SafeArea(
        child: Center(
          child: ConstrainedBox(
            constraints: const BoxConstraints(maxWidth: 980),
            child: CustomScrollView(
              slivers: [
                SliverAppBar.large(
                  title: Text(title),
                  actions: action == null ? null : [action!],
                  backgroundColor: Theme.of(context).scaffoldBackgroundColor,
                ),
                SliverPadding(
                  padding: const EdgeInsets.fromLTRB(16, 0, 16, 24),
                  sliver: SliverToBoxAdapter(child: child),
                ),
              ],
            ),
          ),
        ),
      );
    }

    final media = MediaQuery.of(context);
    final compactHeight = media.size.height <= 700;
    final compactWidth = media.size.width <= 360;
    final horizontal = compactWidth ? 14.0 : 18.0;
    return SafeArea(
      bottom: false,
      child: Center(
        child: ConstrainedBox(
          constraints: const BoxConstraints(maxWidth: 980),
          child: CustomScrollView(
            physics: const BouncingScrollPhysics(parent: AlwaysScrollableScrollPhysics()),
            slivers: [
              SliverToBoxAdapter(
                child: Padding(
                  padding: EdgeInsets.fromLTRB(
                    horizontal,
                    compactHeight ? 8 : 12,
                    horizontal,
                    compactHeight ? 8 : 12,
                  ),
                  child: Row(
                    children: [
                      Expanded(
                        child: Text(
                          title,
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: (compactHeight
                                  ? Theme.of(context).textTheme.titleLarge
                                  : Theme.of(context).textTheme.headlineSmall)
                              ?.copyWith(
                            fontWeight: FontWeight.w800,
                            letterSpacing: -0.35,
                            color: _WorkbenchColors.charcoal,
                          ),
                        ),
                      ),
                      if (action != null) ...[
                        const SizedBox(width: 10),
                        action!,
                      ],
                    ],
                  ),
                ),
              ),
              SliverPadding(
                padding: EdgeInsets.fromLTRB(horizontal, 0, horizontal, 20),
                sliver: SliverToBoxAdapter(child: child),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
'''
          text = text[:frame_start] + new_frame + text[frame_end:]

          # Android-only premium Home empty state.
          old = """            if (calm)\n              Container("""
          new = """            if (_usesPremiumAndroid(context))\n              Container(\n                padding: EdgeInsets.fromLTRB(\n                  20,\n                  MediaQuery.sizeOf(context).height <= 700 ? 18 : 22,\n                  20,\n                  20,\n                ),\n                decoration: BoxDecoration(\n                  gradient: const LinearGradient(\n                    begin: Alignment.topLeft,\n                    end: Alignment.bottomRight,\n                    colors: [Color(0xFFFFFEFA), Color(0xFFF0F5F1)],\n                  ),\n                  borderRadius: BorderRadius.circular(24),\n                  border: Border.all(color: _WorkbenchColors.line),\n                  boxShadow: const [\n                    BoxShadow(\n                      color: Color(0x24182B24),\n                      blurRadius: 24,\n                      offset: Offset(0, 10),\n                    ),\n                  ],\n                ),\n                child: Column(\n                  children: [\n                    ClipRRect(\n                      borderRadius: BorderRadius.circular(20),\n                      child: Image.asset(\n                        'kitchen_prep_mark.png',\n                        width: MediaQuery.sizeOf(context).height <= 700 ? 62 : 74,\n                        height: MediaQuery.sizeOf(context).height <= 700 ? 62 : 74,\n                        fit: BoxFit.cover,\n                      ),\n                    ),\n                    SizedBox(height: MediaQuery.sizeOf(context).height <= 700 ? 10 : 14),\n                    Text(\n                      s.t('noBoard'),\n                      style: Theme.of(context).textTheme.headlineSmall?.copyWith(\n                            fontWeight: FontWeight.w800,\n                            color: _WorkbenchColors.charcoal,\n                          ),\n                      textAlign: TextAlign.center,\n                    ),\n                    const SizedBox(height: 6),\n                    Text(\n                      s.t('trackQuantities'),\n                      style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n                            color: _WorkbenchColors.muted,\n                          ),\n                      textAlign: TextAlign.center,\n                    ),\n                  ],\n                ),\n              )\n            else if (calm)\n              Container("""
          if old not in text:
              raise SystemExit('Home empty-state anchor missing')
          text = text.replace(old, new, 1)

          # Android-only premium active board summary while preserving iOS branch.
          marker = "    if (_usesCalmWorkbench(context)) {"
          idx = text.index(marker, text.index('class ActiveSummary'))
          android_block = r'''    if (_usesPremiumAndroid(context)) {
      return Container(
        padding: const EdgeInsets.all(16),
        decoration: BoxDecoration(
          gradient: const LinearGradient(
            begin: Alignment.topLeft,
            end: Alignment.bottomRight,
            colors: [Color(0xFFFFFEFA), Color(0xFFF0F5F1)],
          ),
          borderRadius: BorderRadius.circular(22),
          border: Border.all(color: _WorkbenchColors.line),
          boxShadow: const [
            BoxShadow(
              color: Color(0x24182B24),
              blurRadius: 22,
              offset: Offset(0, 9),
            ),
          ],
        ),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              children: [
                Expanded(
                  child: Text(
                    board.title,
                    maxLines: 2,
                    overflow: TextOverflow.ellipsis,
                    style: Theme.of(context).textTheme.titleLarge?.copyWith(
                          fontWeight: FontWeight.w800,
                          color: _WorkbenchColors.charcoal,
                        ),
                  ),
                ),
                if (board.status == BoardStatus.paused)
                  _StatusPill(
                    label: s.t('pausedBoard'),
                    color: _WorkbenchColors.orange,
                    background: _WorkbenchColors.orangeSoft,
                  ),
              ],
            ),
            const SizedBox(height: 14),
            LayoutBuilder(
              builder: (context, constraints) {
                final columns = constraints.maxWidth < 340 ? 2 : 4;
                final itemWidth =
                    (constraints.maxWidth - ((columns - 1) * 8)) / columns;
                return Wrap(
                  spacing: 8,
                  runSpacing: 8,
                  children: [
                    SizedBox(width: itemWidth, child: _LaneMetric(label: s.t('now'), value: now, color: _WorkbenchColors.orange)),
                    SizedBox(width: itemWidth, child: _LaneMetric(label: s.t('next'), value: next, color: _WorkbenchColors.sage)),
                    SizedBox(width: itemWidth, child: _LaneMetric(label: s.t('waiting'), value: waiting, color: _WorkbenchColors.muted)),
                    SizedBox(width: itemWidth, child: _LaneMetric(label: s.t('done'), value: board.doneCount, color: const Color(0xFF6E8C65))),
                  ],
                );
              },
            ),
          ],
        ),
      );
    }
'''
          text = text[:idx] + android_block + text[idx:]

          # Android-only premium grocery row styling. No logic changes.
          old_list = '''          for (final item in filtered)\n            CheckboxListTile(\n              value: selected.contains(item.id),\n              title: Text(item.display(locale)),\n              dense: true,\n              onChanged: (_) => setState(() {\n                selected.contains(item.id)\n                    ? selected.remove(item.id)\n                    : selected.add(item.id);\n              }),\n            ),'''
          new_list = '''          for (final item in filtered)\n            if (_usesPremiumAndroid(context))\n              Padding(\n                padding: const EdgeInsets.only(bottom: 6),\n                child: Material(\n                  color: selected.contains(item.id)\n                      ? _WorkbenchColors.sageSoft.withValues(alpha: 0.72)\n                      : _WorkbenchColors.paper,\n                  elevation: selected.contains(item.id) ? 1.5 : 0.5,\n                  shadowColor: const Color(0x24182B24),\n                  borderRadius: BorderRadius.circular(16),\n                  child: CheckboxListTile(\n                    value: selected.contains(item.id),\n                    title: Text(\n                      item.display(locale),\n                      style: const TextStyle(fontWeight: FontWeight.w600),\n                    ),\n                    dense: true,\n                    shape: RoundedRectangleBorder(\n                      borderRadius: BorderRadius.circular(16),\n                    ),\n                    onChanged: (_) => setState(() {\n                      selected.contains(item.id)\n                          ? selected.remove(item.id)\n                          : selected.add(item.id);\n                    }),\n                  ),\n                ),\n              )\n            else\n              CheckboxListTile(\n                value: selected.contains(item.id),\n                title: Text(item.display(locale)),\n                dense: true,\n                onChanged: (_) => setState(() {\n                  selected.contains(item.id)\n                      ? selected.remove(item.id)\n                      : selected.add(item.id);\n                }),\n              ),'''
          if old_list not in text:
              raise SystemExit('grocery list anchor missing')
          text = text.replace(old_list, new_list, 1)

          p.write_text(text)

          # Android-only visual depth in theme; iOS theme branch remains untouched.
          main = Path('flutter_app/lib/main.dart')
          m = main.read_text()
          android_theme = '''              ? ThemeData(\n                  useMaterial3: true,\n                  brightness: Brightness.light,\n                  colorSchemeSeed: const Color(0xFF496554),\n                  scaffoldBackgroundColor: const Color(0xFFF8FAF7),\n                  cardTheme: const CardThemeData(margin: EdgeInsets.zero),\n                  inputDecorationTheme: const InputDecorationTheme(\n                    border: OutlineInputBorder(),\n                  ),\n                )'''
          android_premium = '''              ? ThemeData(\n                  useMaterial3: true,\n                  brightness: Brightness.light,\n                  colorSchemeSeed: const Color(0xFF315D4B),\n                  scaffoldBackgroundColor: const Color(0xFFF4F1E8),\n                  cardTheme: CardThemeData(\n                    margin: EdgeInsets.zero,\n                    elevation: 2.0,\n                    shadowColor: const Color(0x24182B24),\n                    surfaceTintColor: Colors.transparent,\n                    color: const Color(0xFFFFFEFA),\n                    shape: RoundedRectangleBorder(\n                      borderRadius: BorderRadius.circular(18),\n                      side: const BorderSide(color: Color(0xFFDCE1D9)),\n                    ),\n                  ),\n                  navigationBarTheme: const NavigationBarThemeData(\n                    height: 64,\n                    elevation: 3,\n                    backgroundColor: Color(0xFFFFFEFA),\n                    indicatorColor: Color(0xFFDDE9E1),\n                  ),\n                  inputDecorationTheme: InputDecorationTheme(\n                    filled: true,\n                    fillColor: const Color(0xFFFFFEFA),\n                    border: OutlineInputBorder(\n                      borderRadius: BorderRadius.circular(14),\n                    ),\n                  ),\n                )'''
          if android_theme not in m:
              raise SystemExit('Android theme anchor missing')
          m = m.replace(android_theme, android_premium, 1)
          main.write_text(m)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Analyze and test
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android APK
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --flavor production \
            --target lib/main.dart \
            --build-name 2.0.0 \
            --build-number 302

      - name: Commit only Android presentation changes
        shell: bash
        run: |
          set -euo pipefail
          git add flutter_app/lib/features/kitchen_shell.dart flutter_app/lib/main.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design(android): premium adaptive Kitchen skin'
          git push origin HEAD:main

      - name: Retain APK
        uses: actions/upload-artifact@v7
        with:
          name: Kitchen-Prep-Board-Android-Premium-302
          path: flutter_app/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 7
