name: Fix Kitchen iOS Production Target

on:
  push:
    branches: [vgc-release-candidate]
    paths:
      - .github/workflows/fix-ios-production-target.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: vgc-release-candidate
      - name: Point production configurations to reviewed main.dart
        shell: bash
        run: |
          set -euo pipefail
          file='flutter_app/ios/Runner.xcodeproj/project.pbxproj'
          count_before="$(grep -c 'FLUTTER_TARGET = lib/main_production.dart;' "$file")"
          [[ "$count_before" == '3' ]] || { echo "Expected 3 production targets, found $count_before" >&2; exit 1; }
          sed -i 's#FLUTTER_TARGET = lib/main_production.dart;#FLUTTER_TARGET = lib/main.dart;#g' "$file"
          [[ "$(grep -c 'FLUTTER_TARGET = lib/main.dart;' "$file")" == '3' ]]
          [[ "$(grep -c 'FLUTTER_TARGET = lib/main_production.dart;' "$file" || true)" == '0' ]]
          git config user.name 'kitchen-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: align iOS production flavor with reviewed entrypoint'
          git push origin HEAD:vgc-release-candidate
